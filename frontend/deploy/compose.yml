services:
  evaluation-frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "50112:50112"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "50112"
      BACKEND_URL: "http://host.docker.internal:50111"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
